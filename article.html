<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OB360 Insights</title><meta name="description" content="Practical brand identity thinking from OB360."><link rel="icon" href="/images/ob360-logo.png"><link rel="stylesheet" href="/css/styles.css"><style>.article-hero{padding:clamp(70px,12vw,170px) 0 65px;background:var(--ink);color:var(--paper)}.article-hero h1{max-width:1000px;color:var(--paper)}.article-meta{margin-bottom:25px;color:var(--gold);font:500 .67rem var(--mono);letter-spacing:.1em;text-transform:uppercase}.article-dek{max-width:680px;margin-top:25px;color:rgba(244,240,232,.72);font-size:1.1rem}.article-copy{max-width:760px}.article-copy p{font-size:1.07rem;line-height:1.85;margin-bottom:23px}.backlink{display:inline-block;margin-bottom:40px;color:var(--red);font:700 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase}</style></head><body><div data-include="header"></div><article><header class="article-hero"><div class="wrap"><div class="article-meta" id="category">Insight</div><h1 id="title">Loading article…</h1><p class="article-dek" id="dek"></p></div></header><section class="section"><div class="wrap"><a class="backlink" href="/insights.html">← All insights</a><div class="article-copy" id="body"></div></div></section></article><div data-include="footer"></div><script src="/js/site-settings.js"></script><script src="/js/main.js"></script><script>const id=new URLSearchParams(location.search).get('post');fetch('/content/insights.json').then(r=>r.json()).then(({items})=>{const p=items.find(x=>x.id===id);if(!p)throw Error();document.title=p.title+' — OB360';title.textContent=p.title;dek.textContent=p.description;category.textContent=p.category+' · '+p.readTime;p.body.forEach(x=>{const e=document.createElement('p');e.textContent=x;body.append(e)})}).catch(()=>{title.textContent='That article is not here.'})</script></body></html>
